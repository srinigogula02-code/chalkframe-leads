<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Chalkframe mark</title>
  <desc id="desc">A violet module completing the lower-right corner of a structural frame</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0F172A"/>
  <rect x="96" y="96" width="320" height="320" fill="#6366F1" fill-opacity=".18" stroke="#6366F1" stroke-width="14"/>
  <rect x="304" y="304" width="112" height="112" fill="#A78BFA" filter="url(#glow)"/>
</svg>
